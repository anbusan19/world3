<!doctype html><meta charset="utf-8"><title>Landmark models</title>
<script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>body{margin:0;font:600 13px system-ui;background:#F5F1E4}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px}.c{background:#fff;border-radius:16px;overflow:hidden}model-viewer{width:100%;height:330px;--poster-color:transparent;background:linear-gradient(#9CC8DD,#E6D9B8)}p{margin:6px 12px}</style>
<div class="g" id="g"></div>
<script>
const all = ['taj-mahal','india-gate','qutub-minar','charminar','hawa-mahal','lotus-temple','victoria-memorial','golden-temple','meenakshi-gopuram','gol-gumbaz','sanchi-stupa','mahabodhi-temple','brihadisvara-temple','howrah-bridge','red-fort','mysore-palace','konark-sun-temple','gateway-of-india','csmt','khajuraho-temple'];
const p = new URLSearchParams(location.search); const set = Number(p.get('set') || 0); const only = (p.get('only') || '').split(',').filter(Boolean); const orbit = p.get('o') || '35deg 70deg auto';
document.getElementById('g').innerHTML = (only.length ? only : all.slice(set * 6, set * 6 + 6)).map((n) => `<div class="c"><model-viewer src="${n}.glb" camera-orbit="${orbit}" camera-target="0m 1.7m 0m" field-of-view="38deg" exposure="1.1" shadow-intensity="0.6" interaction-prompt="none"></model-viewer><p>${n}</p></div>`).join('');
</script>
