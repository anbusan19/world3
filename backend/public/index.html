<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>World3 Spots</title>
  <link rel="icon" href="/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/skin.css">
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand"><picture><source media="(prefers-color-scheme: dark)" srcset="/title-dark.png"><img src="/title-light.png" height="30" alt="World3"></picture><em>Spots</em></div>
    <div class="grow"></div>
    <div class="eventbox">
      <button id="eventChip" class="eventchip" type="button" aria-expanded="false" title="When the event ends, the spots disappear and ads stop">Event: …</button>
      <form id="eventForm" class="eventform" hidden>
        <label>Event ends<input id="eventEnd" type="datetime-local" required></label>
        <div class="row2"><button class="btn primary sm" type="submit">Save</button><button id="eventClear" class="btn sm" type="button">No end time</button></div>
        <p class="fine">After this time the app no longer gets the spots, nothing can be captured and no ad is shown.</p>
      </form>
    </div>
    <span id="status" class="status"><i></i><span>Connecting…</span></span>
    <a class="link on" href="/">Spots</a>
    <a class="link" href="/events.html">Events</a>
    <a class="link" href="/sponsors.html">Sponsors</a>
    <a class="link" href="/sponsor.html" target="_blank" rel="noopener">Advertiser page</a>
    <a class="link" href="/api/v1/spots" target="_blank" rel="noopener">App feed</a>
  </header>
  <div class="kpis" id="kpis" aria-live="polite"></div>

  <main class="grid">
    <aside class="panel list">
      <div class="panel-head">
        <h2>Spots</h2>
        <button id="new" class="btn primary" type="button">+ New spot</button>
      </div>
      <ul id="spots" class="spots"></ul>
      <p class="fine">Drafts are only visible here. The app only gets <b>published</b> spots.</p>
    </aside>

    <section class="mapwrap">
      <div id="map"></div>
      <div class="tools">
        <div class="seg" id="basemap" role="group" aria-label="Map style">
          <button type="button" data-v="cartoon" class="on">Cartoon</button>
          <button type="button" data-v="streets">Streets</button>
        </div>
        <form id="find" class="find" autocomplete="off">
          <input id="findInput" type="text" placeholder="Paste coordinates  18.922, 72.8347" aria-label="Go to coordinates">
          <button class="btn" type="submit">Go</button>
          <button class="btn icon" type="button" id="locate" title="Use my location" aria-label="Use my location">◎</button>
        </form>
      </div>
      <div id="hint" class="hint" hidden></div>
    </section>

    <aside class="panel editor" id="editor"></aside>
  </main>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
