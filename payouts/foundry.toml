# Sponsor funding and payouts, built on its own so nothing about the app, the backend or the deployed Stamp changes while it is tested.
# It reuses the stamp contract's source and OpenZeppelin from ../contracts (no copies).
[profile.default]
src = "src"
out = "out"
libs = ["../contracts/lib"]
test = "test"
script = "script"
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=../contracts/lib/openzeppelin-contracts/contracts/",
  "stamp/=../contracts/src/",
]
allow_paths = ["../contracts"]

[fmt]
line_length = 120

[fuzz]
runs = 512
